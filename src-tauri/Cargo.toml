[package]
name = "tokopro-app"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tokopro_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
argon2 = { version = "0.6.0", features = ["getrandom"] }
chrono = "0.4.45"
calamine = "0.38.0"
rust_xlsxwriter = "0.103.0"
tauri-plugin-dialog = "2.8.4"
perintah-macro = { path = "perintah-macro" }
sha2 = "0.11"
getrandom = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["net", "sync", "time"] }
if-addrs = "0.15"
# reqwest datang lewat plugin updater, dibangun dengan rustls tanpa penyedia kripto, dan `Client::new()` gagal
# (panik) tanpa penyedia, juga untuk http biasa. `jaringan::klien::klien_http` memasang penyedia ring (sudah ada di Cargo.lock) sekali.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
hmac = "0.13.0"


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"

[dev-dependencies]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
